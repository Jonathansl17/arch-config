set -g history-limit 50000
set -g status off
set -g mouse off
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:smcup@:rmcup@"
set -sg escape-time 10
set -g exit-empty on
set -g destroy-unattached on

# Desactivar todos los binds default (no panes/ventanas/prefix)
unbind-key -a
set -g prefix None

# Ctrl+A → scrollback al clipboard X11
bind -n C-a run-shell -b "tmux capture-pane -pS - | sed -e 's/[[:space:]]*$//' | tac | awk 'NF{p=1}p' | tac | xclip -sel clip"
