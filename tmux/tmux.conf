set -g history-limit 50000
set -g status off
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc,*:RGB"
set -sg escape-time 10
set -g exit-empty on
set -g destroy-unattached on
unbind C-b

# Barra copy-mode / mensajes: blanco y negro
set -g mode-style "bg=white,fg=black"
set -g message-style "bg=white,fg=black"
set -g message-command-style "bg=white,fg=black"
set -g copy-mode-match-style "bg=white,fg=black"
set -g copy-mode-current-match-style "bg=black,fg=white"

# Ctrl+A → todo scrollback al clipboard X11 (setsid para sobrevivir cierre terminal)
bind -n C-a run-shell -b "tmux capture-pane -pS - | sed -e 's/[[:space:]]*$//' | tac | awk 'NF{p=1}p' | tac | xclip -sel clip"
